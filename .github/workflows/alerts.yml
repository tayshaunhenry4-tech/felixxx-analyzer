name: FelixXx background alerts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test notification'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: felixxx-alerts
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hunt A+ setups and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST: ${{ inputs.send_test }}
          APP_URL: https://tayshaunhenry4-tech.github.io/felixxx-analyzer/
        run: node alerts/hunt.mjs
      - name: Save setup log
        if: always()
        run: |
          if [ -n "$(git status --porcelain alerts)" ]; then
            git config user.name "felixxx-bot"
            git config user.email "felixxx-bot@users.noreply.github.com"
            git add alerts
            git commit -m "alert log"
            git pull --rebase origin main && git push || true
          fi
